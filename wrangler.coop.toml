# Opt-in local/experimental input proof. Production wrangler.toml is unchanged.
name = "supertux-private-input-proof"
main = "worker/index.js"
compatibility_date = "2026-10-06"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/coop/*", "/game-assets/*", "/coop-art/*"]

[[r2_buckets]]
binding = "GAME_ASSETS"
bucket_name = "supertux-assets"

[[durable_objects.bindings]]
name = "COOP_ROOMS"
class_name = "CoopRoom"

[[migrations]]
tag = "input-proof-v1"
new_sqlite_classes = ["CoopRoom"]
