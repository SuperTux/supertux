name: GNU/Linux
concurrency:
  group: gnulinux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  gnulinux:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(toJSON(inputs.full_matrix) == 'false' && '{"include":[{"arch":64,"os":"ubuntu-26.04","compiler":"gcc","build_type":"Release"}]}' || '{"arch":[32,64],"os":["ubuntu-26.04"],"compiler":["gcc","clang"],"build_type":["Debug","Release"],"include":[{"os":"ubuntu-26.04","build_type":"Release","arch":64,"release":true,"source":true,"documentation":true,"coverage":true}]}')
        }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Install 64-bit dependencies
      if: ${{ matrix.arch == 64 }}
      run: |-
        if [ "$FOCUSED" = true ]; then
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgtest-dev libglu1-mesa-dev libogg-dev libvorbis-dev libopenal-dev libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev libglib2.0-dev libfreetype6-dev libraqm-dev libglew-dev libglbinding-dev libcurl4-openssl-dev libglm-dev libfmt-dev libphysfs-dev zlib1g-dev
        else
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            automake \
            gtk-doc-tools \
            fuse \
            rpm \
            rename \
            sshpass \
            clang \
            g++ \
            libglu1-mesa-dev \
            libgtest-dev \
            libc++-dev \
            libogg-dev \
            libvorbis-dev \
            libopenal-dev \
            libsdl3-dev \
            libsdl3-image-dev \
            libsdl3-ttf-dev \
            libglib2.0-dev \
            libfreetype6-dev \
            libraqm-dev \
            libglew-dev \
            libglbinding-dev \
            libcurl4-openssl-dev \
            libglm-dev \
            libfmt-dev \
            libphysfs-dev \
            zlib1g-dev \
            lcov \
            doxygen
        fi
      env:
        FOCUSED: ${{ toJSON(inputs.full_matrix) == 'false' }}
    - name: Install 32-bit dependencies
      if: ${{ matrix.arch == 32 }}
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update

        sudo apt-get install -y \
          cmake \
          ninja-build \
          build-essential \
          automake \
          gtk-doc-tools \
          fuse \
          rpm \
          rename \
          sshpass \
          clang \
          gcc-multilib \
          g++-multilib \
          libglu1-mesa-dev:i386 \
          libogg-dev:i386 \
          libvorbis-dev:i386 \
          libopenal-dev:i386 \
          libsdl3-dev:i386 \
          libsdl3-image-dev:i386 \
          libsdl3-ttf-dev:i386 \
          libfreetype6-dev:i386 \
          libcurl4-openssl-dev:i386 \
          zlib1g-dev:i386 \
          libfmt-dev:i386 \
          libepoxy-dev:i386 \
          libglm-dev

        # Let's get out of this directory to disable vcpkg manifest mode.
        # Manifest mode is not adequate here because most dependencies can
        # be used via the system package manager.
        pushd /

        # These libraries don't exist for 32-bit in Ubuntu repositories.
        vcpkg integrate install
        vcpkg install --triplet x86-linux physfs libraqm

        popd
    - name: Set compiler (gcc)
      if: ${{ matrix.compiler == 'gcc' }}
      run: |
        echo "CXX=g++" >> $GITHUB_ENV
        echo "CC=gcc" >> $GITHUB_ENV
    - name: Set compiler (clang)
      if: ${{ matrix.compiler == 'clang' }}
      run: |
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
    - name: Run slugify
      id: slugify
      uses: eltimn/slugify-action@v2.0.2
    - name: Configure build
      shell: pwsh
      env:
        GIT_HASH: ${{ steps.slugify.outputs.sha }}
        GIT_BRANCH: ${{ steps.slugify.outputs.branch }}
        BUILD_TYPE: ${{ matrix.build_type }}
        32BIT: ${{ matrix.arch == 32 }}
        MAKE_DOCS: ${{ matrix.documentation }}
        GLBINDING: ${{ matrix.glbinding }}
        MAKE_TESTS: ${{ toJSON(inputs.full_matrix) == 'false' }}
      run: |
        $Env:GIT_TAG = (& git describe --tags --abbrev=0)

        echo "Git information:"
        echo "- GIT_TAG: $Env:GIT_TAG"
        echo "- GIT_HASH: $Env:GIT_HASH"
        echo "- GIT_BRANCH: $Env:GIT_BRANCH"

        & cmake --version
        & $Env:CXX --version

        mkdir "build"
        cd "build"

        # Pass -DPhysFS_PREFER_FIND_PACKAGE=ON because we use
        # vcpkg for physfs on 32bit
        & cmake .. -DCMAKE_BUILD_TYPE="$Env:BUILD_TYPE" -DENABLE_DISCORD=ON `
                   -DCMAKE_INSTALL_MESSAGE=NEVER -DCMAKE_INSTALL_PREFIX=/usr `
                   -DCMAKE_POLICY_VERSION_MINIMUM="3.5" `
                   -DGIT_HASH="$Env:GIT_HASH" `
                   -DGIT_BRANCH="$Env:GIT_BRANCH" `
                   $(if ($Env:32BIT -eq "true") {
                     "-DCMAKE_TOOLCHAIN_FILE=$Env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake "
                     "-DVCPKG_TARGET_TRIPLET=x86-linux "
                     "-DVCPKG_MANIFEST_MODE=OFF "
                     "-DPhysFS_PREFER_FIND_PACKAGE=ON"
                     "-DUSE_GL_LIBRARY=libepoxy"
                   }) `
                   -DBUILD_DOCUMENTATION="$(if ($Env:MAKE_DOCS -eq "true") {"ON"} else {"OFF"})" `
                   -DCMAKE_CXX_FLAGS="$(if ($Env:32BIT -eq "true") {"-m32"})" `
                   -DCMAKE_C_FLAGS="$(if ($Env:32BIT -eq "true") {"-m32"})" `
                   -DBUILD_TESTING="$Env:MAKE_TESTS"
    - name: Build and install
      working-directory: build
      run: |
        make -j3 VERBOSE=1
        make install DESTDIR="/tmp/supertux" VERBOSE=1
    - name: Representative native unit tests
      if: toJSON(inputs.full_matrix) == 'false'
      run: ctest --test-dir build --output-on-failure
    - name: Make documentation
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (matrix.documentation) }}
      working-directory: build
      run: |
        doxygen docs/Doxyfile
    - name: Package
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (matrix.arch != '32' && matrix.build_type != 'Debug') }}
      env:
        OS_NAME: ${{ matrix.os }}
        ARCH: ${{ matrix.arch }}
        COMPILER_NAME: ${{ matrix.compiler }}
        BUILD_NAME: ${{ matrix.build_type }}
        PACKAGE: 'ON'
        SOURCE: ${{ matrix.source }}
      working-directory: build
      run: ../.ci_scripts/package.sh
    - name: Upload AppImage
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (matrix.build_type != 'Debug') }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.compiler }}-${{ steps.slugify.outputs.branch }}-${{ steps.slugify.outputs.sha }}-${{ matrix.build_type
          }}-appimage
        path: build/upload/*.AppImage
        if-no-files-found: ignore
    - name: Upload source
      uses: actions/upload-artifact@v4
      with:
        name: source
        path: build/upload/*Source.tar.gz
        if-no-files-found: ignore
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (true) }}
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: build/coverage/*
        if-no-files-found: ignore
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (true) }}
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: build/docs/doxygen/html/*
        if-no-files-found: ignore
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (true) }}
    - name: Upload tar archives
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.compiler }}-${{ matrix.build_type }}${{ matrix.glbinding == 'ON' && '-glbinding' || '' }}-tgz
        path: build/upload/*Linux.tar.gz
        if-no-files-found: ignore
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (true) }}
    - name: Upload to nightlies
      uses: parth-paradkar/upload-s3-without-acl@68848b62953464adb87bd48793f7ec58b8af427c
      if: ${{ toJSON(inputs.full_matrix) != 'false' && (matrix.release && env.CI_KEY != null) }}
      env:
        CI_KEY: ${{ secrets.CI_DOWNLOAD_ACCESS_KEY_ID }}
      with:
        aws_bucket: supertux-ci-downloads
        aws_key_id: ${{ secrets.CI_DOWNLOAD_ACCESS_KEY_ID }}
        aws_secret_access_key: ${{ secrets.CI_DOWNLOAD_SECRET_ACCESS_KEY }}
        source_dir: build/upload
        destination_dir: ci-build/${{ github.sha }}/gh-actions/${{ matrix.os }}-${{ matrix.arch }}/${{ github.run_id }}
    - name: Post uploaded file
      if: matrix.release && env.DOWNLOAD_APIKEY != null
      working-directory: build
      run: ../.ci_scripts/deploy.sh
      env:
        PREFIX: ci-build/${{ github.sha }}/gh-actions/${{ matrix.os }}-${{ matrix.arch }}/${{ github.run_id }}
        DOWNLOAD_APIKEY: ${{ secrets.DOWNLOAD_APIKEY }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    - name: Prepare Release
      if: startsWith(github.ref, 'refs/tags/') && matrix.release
      env:
        OS: ${{ matrix.os }}
        ARCH: ${{ matrix.arch }}
      run: |
        if [ "$ARCH" = "32" ]; then
          rename 's/.tar.gz/-32.tar.gz/' build/upload/SuperTux-*
        fi
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') && matrix.release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: build/upload/SuperTux-*
        draft: true
'on':
  workflow_dispatch: null
  workflow_call:
    inputs:
      full_matrix:
        type: boolean
        default: true
  schedule:
  - cron: 20 5 * * 2
  push:
    tags:
    - '*'
