name: WebAssembly
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - mobile-web-phase1-wasm-reliability
    tags:
      - '*'
  pull_request: {}

permissions:
  contents: read

env:
  EMSDK_VERSION: '6.0.11'
  VCPKG_COMMIT: 'c748cb44f2a435fcf015c35225c9d5545fe0021c'

jobs:
  wasm:
    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release", "Debug"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole tree so git describe works
          fetch-depth: 0
          submodules: recursive

      - name: Install emscripten tools
        run: |
          cd ~

          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build pkg-config build-essential curl zip rsync

          git clone --branch "$EMSDK_VERSION" --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

          git clone https://github.com/microsoft/vcpkg.git ~/wasm-vcpkg
          git -C ~/wasm-vcpkg checkout "$VCPKG_COMMIT"
          ~/wasm-vcpkg/bootstrap-vcpkg.sh -disableMetrics
          source ~/emsdk/emsdk_env.sh
          emcc --version
          git -C ~/wasm-vcpkg rev-parse HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Storage startup and failure checks
        run: node tests/wasm/storage.test.cjs

      - name: Use cached dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: wasm-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', '.github/workflows/wasm.yml') }}

      - name: Configure build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          source ~/emsdk/emsdk_env.sh
          # TODO: Re-add -DWERROR=ON when warnings will be fixed
          emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DWARNINGS=ON \
                           -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                           -DCMAKE_TOOLCHAIN_FILE=~/wasm-vcpkg/scripts/buildsystems/vcpkg.cmake \
                           -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=~/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
                           -DVCPKG_TARGET_TRIPLET=wasm32-emscripten -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                           -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON

      - name: Sync data folder
        working-directory: build
        run: |
          rsync -a ../data/ data/

      - name: Build
        working-directory: build
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --build . --parallel 4 2>&1 | tee build.log

        # Now you can run a local server with: `emrun supertux2.html`
        # Or any traditional web server will do the job
        # Note: opening the html file manually (file:///) won't work

      - name: Setup files for upload
        working-directory: build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          cp template.html supertux2.html
          mkdir upload/
          for suffix in html js wasm data png ico; do
            test -s "supertux2.$suffix"
            cp "supertux2.$suffix" upload/
          done
          test -s supertux2_bkg.png
          cp supertux2_bkg.png upload/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser validation tools
        run: |
          python -m pip install playwright==1.62.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium

      - name: Real browser boot, input, and persistence smoke
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          smoke_options=()
          # Existing player/library UB is outside this phase's gameplay boundary.
          # These exact sites are annotated and archived; every new site fails.
          if [ "$BUILD_TYPE" = Debug ]; then smoke_options+=(--record-known-ub); fi
          python tests/wasm/browser_smoke.py build --output build/browser-evidence "${smoke_options[@]}" 2>&1 | tee build/browser-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-${{ matrix.build_type }}-validation
          path: |
            build/browser-evidence/
            build/build.log
            build/browser-smoke.log
            build/compile_commands.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: "wasm32-emscripten-${{ matrix.build_type }}-html"
          path: build/upload/*
          if-no-files-found: error

      - name: Upload to server
        if: ${{ github.ref == 'refs/heads/master' && matrix.build_type == 'Release' }}
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
        run: |
          cd build/upload/
          mv supertux2.html index.html
          zip supertux2.zip *
          curl -F "archive=@$(pwd)/supertux2.zip" -F "message=$(git log --format=%B -n 1 | head -1)" $UPLOAD_URL
